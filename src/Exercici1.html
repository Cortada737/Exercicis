<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cercador de Repositoris GitHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container" style="max-width: 800px;">

    <!-- Títol Principal -->
    <h1 class="h3 text-center text-success fw-bold mb-4">Cercador de Repositoris GitHub</h1>

    <!-- Formulari de Cerca -->
    <div class="card p-3 shadow-sm mb-4">
        <form id="searchForm" class="d-flex gap-2">
            <input
                    type="text"
                    id="usernameInput"
                    class="form-control form-control-lg"
                    placeholder="Introdueix l'usuari de GitHub (ex: torvalds)"
                    required
            >
            <button type="submit" class="btn btn-success btn-lg px-4">Cercar</button>
        </form>
    </div>

    <!-- Indicador de Càrrega (Spinner) -->
    <div id="loadingSpinner" class="text-center my-4 d-none">
        <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Carregant...</span>
        </div>
        <p class="text-muted mt-2 small">Cercant usuari i repositoris...</p>
    </div>

    <!-- Missatge d'Error -->
    <div id="errorMessage" class="alert alert-danger shadow-sm d-none" role="alert">
        <strong>Error:</strong> No s'ha trobat cap usuari amb aquest nom a GitHub.
    </div>

    <!-- Targeta de Perfil d'Usuari -->
    <div id="userCard" class="card shadow-sm mb-4 d-none">
        <div class="card-body d-flex align-items-center gap-3">
            <img id="userAvatar" src="" alt="Avatar" class="rounded-circle border border-2 border-success" width="65" height="65">
            <div>
                <h2 id="userName" class="h5 mb-1 text-success fw-bold"></h2>
                <p id="userHandle" class="text-muted mb-1 small"></p>
                <span class="badge bg-success fs-6 fw-normal">
            Seguidors: <strong id="userFollowers">0</strong>
          </span>
            </div>
        </div>
    </div>

    <!-- Taula de Repositoris -->
    <div id="reposCard" class="card shadow-sm d-none">
        <div class="card-header bg-success text-white fw-bold">
            Repositoris Públics
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 35%;">Nom del Repositori</th>
                    <th style="width: 50%;">Descripció</th>
                    <th style="width: 15%;" class="text-center">Estrelles ⭐</th>
                </tr>
                </thead>
                <tbody id="reposList">
                <!-- Les files es crearan dinàmicament -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Enllaç al fitxer JavaScript separat -->
<script src="script.js"></script>
</body>
</html>
